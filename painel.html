<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pro. Barreto Barbearia</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.jpg.jpg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { height: 100%; overscroll-behavior-y: none; background: #121212; color: #FFF; }
        .barber-header { text-align: center; padding: 20px 10px; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .brand-logo-container { width: 100px; height: 100px; margin: 0 auto 15px auto; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 10px rgba(255,102,0,0.2); border: 2px solid #FF6600; }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .barber-header h1 { font-size: 1.5rem; color: #FFF; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Modais */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: 0.2s; }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal { background: #1A1A1A; border: 1px solid #333; border-radius: 8px; padding: 25px; width: 90%; max-width: 420px; text-align: center; }
        .custom-modal input, .custom-modal select { width: 100%; padding: 12px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF; margin-bottom: 15px; outline: none; }
        .custom-modal-btn { width: 100%; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; border: none; margin-bottom: 10px; }

        /* Nova Grade Horizontal Semanal para o Barbeiro */
        .week-horizontal-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 15px;
            width: 100%;
        }
        .day-column {
            min-width: 250px; 
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .day-header { font-size: 0.95rem; color: #FFF; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Slots de Atendimento */
        .slot-item { background: #242424; padding: 10px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #333; border-left: 4px solid #555; color: #FFF; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .slot-item.booked { border-left-color: #3498db; }
        .slot-item.booked-done { border-left-color: #25D366; background: #152219; }
        .slot-item.blocked { border-left-color: #e74c3c; background: #2C1A1A; }
        .slot-item.busy { border-left-color: #f39c12; background: #2a2215; opacity: 0.8; }
        .slot-item.available { border-left-color: #FF6600; }

        @media (max-width: 1024px) {
            .week-horizontal-container { grid-template-columns: repeat(6, 260px); }
        }
    </style>
</head>
<body>

    <div class="app-container" style="max-width: 100%;">
        
        <header class="barber-header">
            <div class="brand-logo-container"><img src="logo.jpg.jpg" alt="Logo Barreto"></div>
            <h1>Agenda Pro. Barreto</h1>
        </header>

        <!-- Sessão de Login -->
        <section id="login-section" class="section" style="max-width: 500px; margin: 0 auto;">
            <h2 style="border-left: 3px solid #FF6600; padding-left: 10px;">ACESSO AO PAINEL</h2>
            <div class="datetime-inputs">
                <input type="text" id="login-usuario" placeholder="Login (Matheus, Yann, Rafael ou admin)" style="width:100%; padding:15px; background:#1A1A1A; border:1px solid #333; color:#FFF; border-radius:6px; margin-bottom:10px;">
                <input type="password" id="login-senha" placeholder="Senha" style="width:100%; padding:15px; background:#1A1A1A; border:1px solid #333; color:#FFF; border-radius:6px; margin-bottom:10px;">
                <button onclick="fazerLogin()" style="width:100%; padding:15px; background:#FF6600; color:#FFF; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size: 1.1rem;">ENTRAR</button>
            </div>
        </section>

        <!-- Dashboard Barbeiro (Com Grade Horizontal) -->
        <section id="dashboard-barbeiro" class="section" style="display: none; padding: 0 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h2 id="titulo-agenda-barbeiro" style="margin:0; border:none;">Minha Agenda</h2>
                <div style="display: flex; gap: 10px;">
                    <button onclick="carregarAgendaSemanal()" style="padding: 10px 15px; background: #FF6600; color: #FFF; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;"><i class="fa-solid fa-rotate"></i> Atualizar</button>
                    <button onclick="fazerLogout()" style="padding: 10px 15px; background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c; border-radius: 6px; cursor: pointer; font-weight: bold;">Sair</button>
                </div>
            </div>

            <!-- Navegação da Semana -->
            <div style="display: flex; justify-content: space-between; align-items: center; background: #1A1A1A; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px;">
                <button onclick="mudarSemana(-1)" style="padding: 10px 15px; background: #242424; border: 1px solid #444; color: #FFF; border-radius: 6px; cursor: pointer;"><i class="fa-solid fa-chevron-left"></i> Semana Anterior</button>
                <span id="label-periodo-semana" style="font-weight: bold; color: #FFF; font-size: 1rem;"></span>
                <button onclick="mudarSemana(1)" style="padding: 10px 15px; background: #242424; border: 1px solid #444; color: #FFF; border-radius: 6px; cursor: pointer;">Próxima Semana <i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <!-- GRADE HORIZONTAL -->
            <div id="grade-semanal-container" class="week-horizontal-container"></div>
        </section>

        <!-- Dashboard Admin Geral -->
        <section id="dashboard-admin" class="section" style="display: none; padding: 0 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h2>Painel Administrativo (Geral)</h2>
                <div style="display: flex; gap: 8px;">
                    <button onclick="carregarResumoAdmin()" style="padding: 10px 15px; background: #FF6600; color: #FFF; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;"><i class="fa-solid fa-rotate"></i> Atualizar</button>
                    <button onclick="fazerLogout()" style="padding: 10px 15px; background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c; border-radius: 6px; font-weight: bold; cursor: pointer;">Sair</button>
                </div>
            </div>

            <div style="background: #1A1A1A; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 180px;">
                        <label style="font-size: 0.85rem; color: #888; display: block; margin-bottom: 5px;">Data Específica:</label>
                        <input type="date" id="filter-date-admin" onchange="carregarResumoAdmin()" style="width: 100%; padding: 10px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF; outline: none;">
                    </div>
                    <div style="flex: 1; min-width: 180px;">
                        <label style="font-size: 0.85rem; color: #888; display: block; margin-bottom: 5px;">Filtrar Barbeiro:</label>
                        <select id="admin-select-barbeiro" onchange="carregarResumoAdmin()" style="width: 100%; padding: 10px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF; outline: none;">
                            <option value="TODOS">Todos os Barbeiros</option>
                            <option value="Matheus">Matheus</option>
                            <option value="Yann">Yann</option>
                            <option
