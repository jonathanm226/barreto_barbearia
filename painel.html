<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pro | Barreto Barbearia</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barreto Barbearia">
    <link rel="apple-touch-icon" href="logo.jpg.jpg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { height: 100%; overscroll-behavior-y: none; background: #121212; color: #FFF; }
        .barber-header { text-align: center; padding: 20px 10px; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .brand-logo-container { width: 100px; height: 100px; margin: 0 auto 15px auto; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 10px rgba(255,102,0,0.2); border: 2px solid #FF6600; }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .barber-header h1 { font-size: 1.5rem; color: #FFF; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .barber-header p { font-size: 0.85rem; color: #FF6600; text-transform: uppercase; letter-spacing: 1px; }
        #login-section { min-height: 50vh; display: flex; flex-direction: column; justify-content: center; }
        
        /* Grade Horária do Painel */
        .week-horizontal-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 15px; width: 100%; overflow-x: hidden; }
        .day-column { background: #1A1A1A; border: 1px solid #333; border-radius: 6px; padding: 4px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .day-header { font-size: 0.65rem; color: #FFF; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 4px; display: flex; flex-direction: column; gap: 4px; text-align: center; }
        .slot-item { background: #242424; padding: 5px 3px; border-radius: 4px; font-size: 0.65rem; display: flex; flex-direction: column; gap: 2px; border: 1px solid #333; border-left: 2px solid #555; color: #FFF; cursor: pointer; transition: 0.15s; overflow: hidden; }
        .slot-item:hover { opacity: 0.85; }
        .slot-item.booked { border-left-color: #25D366; background: #152219; }
        .slot-item.concluded { border-left-color: #3498db; background: #15202b; }
        .slot-item.blocked { border-left-color: #e74c3c; background: #2a1616; }
        .slot-item.available { border-left-color: #FF6600; background: #242424; }
    </style>
</head>
<body>

    <div class="app-container" style="max-width: 1000px;">
        
        <header class="barber-header">
            <div class="brand-logo-container">
                <img src="logo.jpg.jpg" alt="Logo Barreto Barbearia">
            </div>
            <div>
                <h1>Agenda Pro. Barreto</h1>
                <p>Painel de Gerenciamento</p>
            </div>
        </header>

        <!-- Seção de Login -->
        <section id="login-section" class="section">
            <h2 style="border-left: 3px solid #FF6600; padding-left: 10px;">ACESSO AO PAINEL</h2>
            <div class="datetime-inputs" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="input-group">
                    <label for="login-usuario">Login (Matheus, Yann, Rafael ou admin):</label>
                    <input type="text" id="login-usuario" autocomplete="username" autocapitalize="none" autocorrect="off">
                </div>
                <div class="input-group">
                    <label for="login-senha">Senha:</label>
                    <input type="password" id="login-senha" autocomplete="current-password">
                </div>
                <button class="btn-primary-action" id="btn-login" onclick="fazerLogin()" style="background: #FF6600; color: #FFF; font-weight: bold; letter-spacing: 1px; padding: 15px; border: none; border-radius: 6px; cursor: pointer;">ENTRAR</button>
            </div>
        </section>

        <!-- Dashboard Individual do Barbeiro -->
        <section id="dashboard-barbeiro" class="section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h2 id="titulo-agenda-barbeiro">Minha Agenda</h2>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button onclick="carregarAgendaSemanal(); carregarFaturamentoBarbeiro();" class="btn-whatsapp" style="width: auto; padding: 8px 12px; font-size: 0.85rem; background: #FF6600; color: #FFF;">
                        <i class="fa-solid fa-rotate"></i> Atualizar
                    </button>
                    <button onclick="fazerLogout()" class="btn-whatsapp" style="width: auto; padding: 8px 12px; font-size: 0.85rem; background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c;">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </button>
                </div>
            </div>

            <!-- Extrato de Faturamento -->
            <div style="background: #1A1A1A; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px;">
                    <h3 style="color: #FFF; font-size: 1rem; margin: 0;"><i class="fa-solid fa-wallet"></i> Extrato de Faturamento</h3>
                    <select id="select-periodo-faturamento" onchange="carregarFaturamentoBarbeiro()" style="width: auto; padding: 6px 10px; font-size: 0.85rem; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF;">
                        <option value="dia">Hoje (Dia)</option>
                        <option value="semana">Esta Semana</option>
                        <option value="mes">Este Mês</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.95rem; margin-bottom: 12px;">
                    <div style="background: #242424; border: 1px solid #333; padding: 10px; border-radius: 6px;">
                        <span style="color: #888; display: block; font-size: 0.75rem;">Atendimentos</span>
                        <strong id="barber-resumo-qtd" style="font-size: 1.2rem; color: #FFF;">0</strong>
                    </div>
                    <div style="background: #242424; border: 1px solid #333; padding: 10px; border-radius: 6px;">
                        <span style="color: #888; display: block; font-size: 0.75rem;">Total Recebido</span>
                        <strong id="barber-resumo-total" style="font-size: 1.2rem; color: #25D366;">R$ 0,00</strong>
                    </div>
                </div>
            </div>

            <!-- Controles de Semana -->
            <div style="background: #1A1A1A; border: 1px solid #333; padding: 14px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
                <div style="font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;">Período da Agenda</div>
                <span id="label-periodo-semana" style="font-weight: bold; color: #FFF; font-size: 1rem; display: block; margin-bottom: 12px;"></span>
                <div style="display: flex; justify-content: space-between; gap: 10px;">
                    <button onclick="mudarSemana(-1)" class="btn-whatsapp" style="flex: 1; padding: 10px; font-size: 0.85rem; border: 1px solid #444; background: #242424; color: #FFF;">
                        <i class="fa-solid fa-chevron-left"></i> Anterior
                    </button>
                    <button onclick="mudarSemana(1)" class="btn-whatsapp" style="flex: 1; padding: 10px; font-size: 0.85rem; border: 1px solid #444; background: #242424; color: #FFF;">
                        Próxima <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <h3 style="font-size: 1rem; margin-bottom: 10px; color: #FFF; text-align: center;">Agenda Semanal</h3>
            <div id="grade-semanal-container" class="week-horizontal-container"></div>
        </section>

    </div>

    <script src="script_painel.js"></script>
</body>
</html>
