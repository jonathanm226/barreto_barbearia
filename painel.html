<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pro. Barreto Barbearia</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barreto">
    <link rel="apple-touch-icon" href="logo.jpg.jpg">
    <link rel="icon" href="logo.jpg.jpg" type="image/jpeg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #FFFFFF; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 100%; background-color: #121212; padding: 8px; padding-bottom: 90px; }
        
        .barber-header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; text-align: center; background: #181818; border-radius: 6px; padding-top: 8px; }
        .brand-logo-container { width: 65px; height: 65px; background: #1A1A1A; border: 2px solid #FF6600; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px auto; overflow: hidden; box-shadow: 0 0 12px rgba(255, 102, 0, 0.5); }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .barber-header h1 { font-size: 1.05rem; color: #FFFFFF; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .barber-header p { font-size: 0.7rem; color: #AAAAAA; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }

        #login-section { min-height: 50vh; display: flex; flex-direction: column; justify-content: center; padding: 0 15px; max-width: 380px; margin: auto; }
        
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: 0.2s ease-in-out; }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal { background: #1A1A1A; border: 1px solid #333; border-radius: 8px; padding: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .custom-modal h3 { color: #FFFFFF; font-size: 1rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .custom-modal p { color: #CCCCCC; font-size: 0.85rem; margin-bottom: 15px; line-height: 1.4; text-align: left; }
        .custom-modal input, .custom-modal select { width: 100%; padding: 10px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFFFFF; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
        .custom-modal-buttons { display: flex; gap: 8px; flex-direction: column; }
        .custom-modal-btn { width: 100%; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; }
        .btn-modal-cancelar { background: #2A2A2A; color: #FFFFFF; border: 1px solid #444; }
        .btn-modal-confirmar { background: #FF6600; color: #FFFFFF; }
        .btn-modal-atendido { background: #25D366; color: #FFFFFF; }
        .btn-modal-excluir { background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c; }

        .week-horizontal-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 6px; width: 100%; overflow-x: hidden; }
        .day-column { background: #1A1A1A; border: 1px solid #333; border-radius: 4px; padding: 2px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .day-header { font-size: 0.58rem; color: #FFFFFF; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 3px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
        
        .slot-item { background: #222222; padding: 3px 2px; border-radius: 3px; font-size: 0.55rem; display: flex; flex-direction: column; gap: 1px; border: 1px solid #333; border-left: 3px solid #555; color: #FFFFFF; cursor: pointer; transition: 0.15s; overflow: hidden; }
        .slot-item:hover { opacity: 0.85; }
        .slot-item.booked { border-left-color: #3498db; background: #192530; }
        .slot-item.concluded { border-left-color: #25D366; background: #13271C; }
        .slot-item.blocked { border-left-color: #e74c3c; background: #2C1A1A; }
        .slot-item.available { border-left-color: #FF6600; background: #1A1A1A; }
        .slot-item.retroactive { border-left-color: #333; background: #161616; opacity: 0.4; cursor: not-allowed; }

        .datetime-inputs { display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 0.8rem; color: #AAAAAA; }
        input, select { width: 100%; padding: 10px; background: #1A1A1A; border: 1px solid #333; border-radius: 6px; color: #FFFFFF; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #FF6600; background: #242424; }
        
        .btn-acao { width: 100%; padding: 10px; background-color: #FF6600; color: #FFFFFF; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; transition: 0.2s; text-transform: uppercase; }
        .btn-acao:hover { background-color: #e05b00; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="barber-header">
            <div class="brand-logo-container">
                <img src="logo.jpg.jpg" alt="Logo Barreto">
            </div>
            <div>
                <h1>Agenda Pro. Barreto</h1>
                <p id="painel-subtitulo">Painel de Atendimento</p>
            </div>
        </header>

        <!-- Sessão de Login -->
        <section id="login-section" class="section">
            <h2 style="border-left: 3px solid #FF6600; padding-left: 8px; font-size: 0.95rem; margin-bottom: 12px; text-transform: uppercase;">ACESSO AO PAINEL</h2>
            <div class="datetime-inputs">
                <div class="input-group">
                    <label for="login-usuario">Utilizador (Rafael, Matheus, Yann ou Admin):</label>
                    <input type="text" id="login-usuario" placeholder="Utilizador">
                </div>
                <div class="input-group">
                    <label for="login-senha">Senha:</label>
                    <input type="password" id="login-senha" placeholder="Senha">
                </div>
                <button class="btn-acao" onclick="fazerLogin()" style="padding: 12px; margin-top: 4px;">ENTRAR</button>
            </div>
        </section>

        <!-- Dashboard Barbeiro -->
        <section id="dashboard-barbeiro" class="section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 4px;">
                <h2 id="titulo-agenda-barbeiro" style="font-size: 0.75rem; text-transform: uppercase;">Minha Agenda</h2>
                <div style="display: flex; gap: 3px; flex-wrap: wrap;">
                    <button onclick="abrirModalAgendamentoManual()" class="btn-acao" style="width: auto; padding: 3px 6px; font-size: 0.55rem; background: #25D366; color: #FFF;">
                        <i class="fa-solid fa-plus"></i> Novo Agendamento
                    </button>
                    <button onclick="carregarAgendaSemanal()" class="btn-acao" style="width: auto; padding: 3px 6px; font-size: 0.55rem; background: #FF6600; color: #FFF;">
                        <i class="fa-solid fa-rotate"></i> Atualizar
                    </button>
                    <button onclick="fazerLogout()" class="btn-acao" style="width: auto; padding: 3px 6px; font-size: 0.55rem; background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c;">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </button>
                </div>
            </div>

            <!-- Navegação da Semana -->
            <div style="background: #1A1A1A; border: 1px solid #333; padding: 6px; border-radius: 6px; margin-bottom: 8px; text-align: center;">
                <div style="font-size: 0.58rem; color: #AAAAAA; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;">Período da Agenda</div>
                <span id="label-periodo-semana" style="font-weight: bold; color: #FFFFFF; font-size: 0.7rem; display: block; margin-bottom: 5px;"></span>
                <div style="display: flex; justify-content: space-between; gap: 4px;">
                    <button onclick="mudarSemana(-1)" class="btn-acao" style="flex: 1; padding: 3px; font-size: 0.58rem; border: 1px solid #444; background: #242424; color: #FFF;">
                        <i class="fa-solid fa-chevron-left"></i> Anterior
                    </button>
                    <button onclick="mudarSemana(1)" class="btn-acao" style="flex: 1; padding: 3px; font-size: 0.58rem; border: 1px solid #444; background: #242424; color: #FFF;">
                        Próxima <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <h3 style="font-size: 0.7rem; margin-bottom: 3px; color: #FFF; text-align: center; text-transform: uppercase;">Visão Geral da Semana</h3>
            <div id="grade-semanal-container" class="week-horizontal-container"></div>
        </section>

        <!-- Dashboard Admin Geral -->
        <section id="dashboard-admin" class="section" style="display: none; padding: 0 5px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2 style="font-size: 0.95rem;">Resumo Administrativo</h2>
                <div style="display: flex; gap: 6px;">
                    <button onclick="carregarResumoAdmin()" class="btn-acao" style="width: auto; padding: 6px 10px; font-size: 0.75rem;"><i class="fa-solid fa-rotate"></i></button>
                    <button onclick="fazerLogout()" class="btn-acao" style="width: auto; padding: 6px 10px; font-size: 0.75rem; background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c;"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 10px;">
                <label for="filter-date-admin">Selecionar Data:</label>
                <input type="date" id="filter-date-admin" onchange="carregarResumoAdmin()">
            </div>

            <div id="agendamentos-list-admin" style="display: flex; flex-direction: column; gap: 6px;"></div>
        </section>

    </div>

    <!-- Modais -->
    <div id="custom-action-modal" class="custom-modal-overlay">
        <div class="custom-modal">
            <h3>Gerenciar Atendimento</h3>
            <div id="action-modal-details" style="text-align: left; background: #242424; padding: 10px; border-radius: 6px; border: 1px solid #444; margin-bottom: 12px; font-size: 0.85rem; color: #DDD;"></div>
            
            <div id="payment-box" style="display: none; text-align: left; margin-bottom: 12px;">
                <label style="font-size: 0.8rem; font-weight: bold; display: block; margin-bottom: 4px;">Forma de Pagamento:</label>
                <select id="select-forma-pagamento">
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Débito">Débito</option>
                    <option value="Crédito">Crédito</option>
                </select>
            </div>

            <div class="custom-modal-buttons" id="action-modal-buttons"></div>
        </div>
    </div>

    <!-- Modal de Agendamento Avulso pelo Barbeiro -->
    <div id="modal-agendamento-manual" class="custom-modal-overlay">
        <div class="custom-modal">
            <h3>Agendamento Avulso (Barbeiro)</h3>
            <div style="text-align: left;">
                <label style="font-size: 0.75rem; color: #aaa;">Nome do Cliente (ex: Idoso / Balcão):</label>
                <input type="text" id="manual-cliente" placeholder="Nome do Cliente">

                <label style="font-size: 0.75rem; color: #aaa;">Telefone / WhatsApp:</label>
                <input type="text" id="manual-telefone" placeholder="00000000000">

                <label style="font-size: 0.75rem; color: #aaa;">Serviço:</label>
                <input type="text" id="manual-servico" value="Corte" placeholder="Serviço prestado">

                <label style="font-size: 0.75rem; color: #aaa;">Preço (R$):</label>
                <input type="number" id="manual-preco" value="35.00" placeholder="35.00">

                <label style="font-size: 0.75rem; color: #aaa;">Data:</label>
                <input type="date" id="manual-data">

                <label style="font-size: 0.75rem; color: #aaa;">Horário:</label>
                <input type="time" id="manual-horario" value="10:00">
            </div>

            <div class="custom-modal-buttons" style="margin-top: 10px;">
                <button class="custom-modal-btn btn-modal-confirmar" onclick="salvarAgendamentoManual()">Salvar Agendamento</button>
                <button class="custom-modal-btn btn-modal-cancelar" onclick="fecharModalAgendamentoManual()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Genérico para Alertas -->
    <div id="modal-alerta" class="custom-modal-overlay" style="z-index: 10000;">
        <div class="custom-modal" style="max-width: 320px;">
            <h3 id="alerta-titulo" style="margin-bottom: 12px; font-size: 1.1rem;">Aviso</h3>
            <p id="alerta-mensagem" style="color: #FFF; font-size: 0.95rem; margin-bottom: 20px; text-align: center;"></p>
            <button class="custom-modal-btn btn-modal-confirmar" onclick="fecharAlerta()">OK</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://doecoosuqibzdsyadsyg.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-30z4xAhwJPYmy1bfSEjCw_loKUe8uL";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioLogado = "";
        let offsetSemana = 0; 

        function mostrarAlerta(mensagem, sucesso = true) {
            const tituloEl = document.getElementById("alerta-titulo");
            tituloEl.textContent = sucesso ? "Sucesso!" : "Aviso!";
            tituloEl.style.color = sucesso ? "#25D366" : "#FF6600";
            document.getElementById("alerta-mensagem").textContent = mensagem;
            document.getElementById("modal-alerta").classList.add("active");
        }

        function fecharAlerta() {
            document.getElementById("modal-alerta").classList.remove("active");
        }

        function obterHorariosParaData(dataString) {
            if (!dataString) return [];
            let horarios = [];
            let horaInicio = 8;
            let horaFim = 22;
            let currentMin = horaInicio * 60;
            let endMin = horaFim * 60;
            
            while (currentMin <= endMin) {
                let h = Math.floor(currentMin / 60);
                let m = currentMin % 60;
                horarios.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
                currentMin += 30; 
            }
            return horarios;
        }

        function fazerLogin() {
            const usuarioInput = document.getElementById("login-usuario").value.replace(/\s+/g, '').toLowerCase();
            const senhaInput = document.getElementById("login-senha").value.replace(/\s+/g, '').toLowerCase();

            if (!usuarioInput || !senhaInput) {
                mostrarAlerta("Preencha o utilizador e a senha.", false);
                return;
            }

            const senhasPermitidas = {
                "rafael": "rafael123",
                "matheus": "matheus123",
                "yann": "yann123",
                "admin": "admin123"
            };

            if (senhasPermitidas[usuarioInput] && senhaInput === senhasPermitidas[usuarioInput]) {
                document.getElementById("login-usuario").value = "";
                document.getElementById("login-senha").value = "";

                if (usuarioInput === 'admin') {
                    usuarioLogado = "Admin";
                    document.getElementById("login-section").style.display = "none";
                    document.getElementById("dashboard-barbeiro").style.display = "none";
                    document.getElementById("dashboard-admin").style.display = "block";
                    
                    const hoje = new Date();
                    document.getElementById("filter-date-admin").value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
                    carregarResumoAdmin();
                } else {
                    usuarioLogado = usuarioInput.charAt(0).toUpperCase() + usuarioInput.slice(1);
                    document.getElementById("login-section").style.display = "none";
                    document.getElementById("dashboard-admin").style.display = "none";
                    document.getElementById("dashboard-barbeiro").style.display = "block";
                    document.getElementById("titulo-agenda-barbeiro").textContent = `Agenda: ${usuarioLogado}`;
                    offsetSemana = 0;
                    carregarAgendaSemanal();
                }
            } else {
                mostrarAlerta("Utilizador ou senha incorretos!", false);
            }
        }

        function fazerLogout() {
            usuarioLogado = "";
            document.getElementById("dashboard-barbeiro").style.display = "none";
            document.getElementById("dashboard-admin").style.display = "none";
            document.getElementById("login-section").style.display = "block";
        }

        function mudarSemana(direcao) {
            offsetSemana += direcao;
            carregarAgendaSemanal();
        }

        function obterDiasDaSemana(offset) {
            const dias = [];
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0); 
            
            const diaSemana = hoje.getDay();
            const diffParaSegunda = (diaSemana === 0 ? -6 : 1) - diaSemana + (offset * 7);
            const segunda = new Date(hoje);
            segunda.setDate(hoje.getDate() + diffParaSegunda);

            for (let i = 0; i < 6; i++) { 
                const d = new Date(segunda);
                d.setDate(segunda.getDate() + i);
                
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const isoString = `${yyyy}-${mm}-${dd}`;
                
                const formatada = d.toLocaleDateString("pt-BR", { weekday: 'short', day: '2-digit', month: '2-digit' });
                dias.push({ iso: isoString, label: formatada });
            }
            return dias;
        }

        async function carregarAgendaSemanal() {
            const container = document.getElementById("grade-semanal-container");
            const lblPeriodo = document.getElementById("label-periodo-semana");
            
            container.innerHTML = "<p style='color: #888; text-align: center; width: 100%; font-size: 0.65rem;'>A carregar...</p>";

            const diasSemana = obterDiasDaSemana(offsetSemana);
            lblPeriodo.textContent = `${diasSemana[0].label} até ${diasSemana[5].label}`;

            const agora = new Date();
            const dataHojeIso = `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}-${String(agora.getDate()).padStart(2, '0')}`;
            const horaAtualMinutos = agora.getHours() * 60 + agora.getMinutes();

            try {
                const primeiraData = diasSemana[0].iso;
                const ultimaData = diasSemana[5].iso;

                const { data: agendamentos } = await _supabase.from("agendamentos_barreto").select("*").ilike("barbeiro", `%${usuarioLogado}%`).gte("data", primeiraData).lte("data", ultimaData);
                const { data: bloqueios } = await _supabase.from("bloqueios_barreto").select("*").ilike("barbeiro", `%${usuarioLogado}%`).gte("data", primeiraData).lte("data", ultimaData);

                container.innerHTML = "";

                const bloqueiosAlmocoAutomaticos = {
                    "Rafael": ["13:00", "13:30"],
                    "Yann": ["12:00", "12:30", "13:00"],
                    "Matheus": ["13:30", "14:00", "14:30"]
                };
                const almocoPadrao = bloqueiosAlmocoAutomaticos[usuarioLogado] || [];

                diasSemana.forEach(dia => {
                    const coluna = document.createElement("div");
                    coluna.className = "day-column";

                    const blqDia = (bloqueios || []).find(b => String(b.data).substring(0, 10) === dia.iso && b.horario === 'TODOS');
                    
                    coluna.innerHTML = `
                        <div class="day-header">
                            <span>${dia.label}</span>
                            <button onclick="alternarBloqueioDia('${dia.iso}', ${!!blqDia})" style="background: ${blqDia ? '#2C1A1A' : '#242424'}; color: ${blqDia ? '#e74c3c' : '#FFF'}; border: 1px solid ${blqDia ? '#e74c3c' : '#444'}; padding: 1px 2px; border-radius: 2px; font-size: 0.5rem; cursor: pointer;">
                                ${blqDia ? 'Desbl' : 'Bloq'}
                            </button>
                        </div>
                    `;

                    const slotsDiv = document.createElement("div");
                    slotsDiv.style.cssText = "display: flex; flex-direction: column; gap: 2px;";

                    if (blqDia) {
                        slotsDiv.innerHTML = `<div style="color: #e74c3c; text-align: center; font-size: 0.55rem; padding: 10px 0; font-weight: bold;"><i class="fa-solid fa-lock"></i></div>`;
                    } else {
                        const horariosDia = obterHorariosParaData(dia.iso);
                        const agendamentosDia = (agendamentos || []).filter(a => String(a.data).substring(0, 10) === dia.iso && a.status !== 'cancelado');
                        const bloqueiosDia = (bloqueios || []).filter(b => String(b.data).substring(0, 10) === dia.iso && b.horario !== 'TODOS');
                        
                        let itensRenderizacao = [];

                        horariosDia.forEach(h => {
                            let ag = agendamentosDia.find(a => String(a.horario).substring(0, 5) === h);
                            let blq = bloqueiosDia.find(b => String(b.horario).substring(0, 5) === h);
                            let ehAlmocoAutomatico = almocoPadrao.includes(h) && !blq;

                            if (ag) {
                                itensRenderizacao.push({ tipo: 'agendamento', horario: h, dado: ag });
                            } else if (blq || ehAlmocoAutomatico) {
                                itensRenderizacao.push({ tipo: 'bloqueio', horario: h, dado: blq, automatico: ehAlmocoAutomatico });
                            } else {
                                itensRenderizacao.push({ tipo: 'vazio', horario: h });
                            }
                        });

                        itensRenderizacao.forEach(item => {
                            const itemSlot = document.createElement("div");

                            let isRetroativo = false;
                            if (dia.iso < dataHojeIso) {
                                isRetroativo = true;
                            } else if (dia.iso === dataHojeIso) {
                                const [hSlot, mSlot] = item.horario.split(':').map(Number);
                                const minSlotTotal = hSlot * 60 + mSlot;
                                if (minSlotTotal < horaAtualMinutos) {
                                    isRetroativo = true;
                                }
                            }

                            if (item.tipo === 'bloqueio') {
                                itemSlot.className = "slot-item blocked";
                                itemSlot.innerHTML = `
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span style="font-weight:bold;">${item.horario}</span>
                                        <button onclick="alternarBloqueioHorario('${dia.iso}', '${item.horario}', true)" style="background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c; padding: 1px 2px; border-radius: 2px; font-size: 0.45rem; cursor: pointer;">Desbl</button>
                                    </div>
                                `;
                            } else if (item.tipo === 'agendamento') {
                                const ag = item.dado;
                                const isConcluido = ag.status === 'concluido';
                                itemSlot.className = isConcluido ? "slot-item concluded" : "slot-item booked";
                                itemSlot.onclick = () => abrirGerenciadorAgendamento(ag.id);
                                itemSlot.innerHTML = `
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span style="font-weight:bold;">${item.horario}</span>
                                        <span style="font-size: 0.48rem; color: ${isConcluido ? '#25D366' : '#3498db'}; font-weight: bold;">
                                            ${isConcluido ? 'OK' : 'AG'}
                                        </span>
                                    </div>
                                    <div style="font-weight: 600; color: #FFD0B0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${ag.cliente}">
                                        ${ag.cliente}
                                    </div>
                                `;
                            } else if (isRetroativo) {
                                itemSlot.className = "slot-item retroactive";
                                itemSlot.innerHTML = `
                                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                        <span style="color:#666;">${item.horario}</span>
                                        <span style="font-size: 0.4rem; color: #666;">Expirado</span>
                                    </div>
                                `;
                            } else {
                                itemSlot.className = "slot-item available";
                                itemSlot.innerHTML = `
                                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                        <span style="color:#AAA;">${item.horario}</span>
                                        <button onclick="alternarBloqueioHorario('${dia.iso}', '${item.horario}', false)" style="background: #242424; color: #FFF; border: 1px solid #444; padding: 0px 3px; border-radius: 2px; font-size: 0.45rem; cursor: pointer;">Bloq</button>
                                    </div>
                                `;
                            }
                            slotsDiv.appendChild(itemSlot);
                        });
                    }
                    coluna.appendChild(slotsDiv);
                    container.appendChild(coluna);
                });
            } catch (err) {
                console.error("Erro agenda:", err);
            }
        }

        async function alternarBloqueioDia(dataIso, estaBloqueado) {
            try {
                if (estaBloqueado) {
                    await _supabase.from("bloqueios_barreto").delete().ilike("barbeiro", `%${usuarioLogado}%`).eq("data", dataIso).eq("horario", "TODOS");
                } else {
                    await _supabase.from("bloqueios_barreto").insert([{ barbeiro: usuarioLogado, data: dataIso, horario: "TODOS", tipo: "dia_todo" }]);
                }
                carregarAgendaSemanal();
            } catch (err) {
                mostrarAlerta("Erro ao alterar bloqueio no banco de dados.", false);
            }
        }

        async function alternarBloqueioHorario(dataIso, horario, estaBloqueado) {
            try {
                if (estaBloqueado) {
                    await _supabase.from("bloqueios_barreto").delete().ilike("barbeiro", `%${usuarioLogado}%`).eq("data", dataIso).eq("horario", horario);
                } else {
                    await _supabase.from("bloqueios_barreto").insert([{ barbeiro: usuarioLogado, data: dataIso, horario: horario, tipo: "horario" }]);
                }
                carregarAgendaSemanal();
            } catch (err) {
                mostrarAlerta("Erro ao alterar bloqueio no banco de dados.", false);
            }
        }

        function abrirModalAgendamentoManual() {
            const hoje = new Date();
            document.getElementById("manual-data").value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
            document.getElementById("manual-cliente").value = "";
            document.getElementById("manual-telefone").value = "";
            document.getElementById("modal-agendamento-manual").classList.add("active");
        }

        function fecharModalAgendamentoManual() {
            document.getElementById("modal-agendamento-manual").classList.remove("active");
        }

        async function salvarAgendamentoManual() {
            const cliente = document.getElementById("manual-cliente").value.trim();
            const telefone = document.getElementById("manual-telefone").value.trim();
            const servico = document.getElementById("manual-servico").value.trim();
            const preco = parseFloat(document.getElementById("manual-preco").value) || 35.00;
            const data = document.getElementById("manual-data").value;
            const horario = document.getElementById("manual-horario").value;

            if (!cliente || !data || !horario) {
                mostrarAlerta("Preencha pelo menos o Nome, a Data e o Horário.", false);
                return;
            }

            try {
                const { error } = await _supabase.from("agendamentos_barreto").insert([{
                    barbeiro: usuarioLogado,
                    cliente: cliente,
                    telefone: telefone || "Balcão",
                    servico: servico,
                    preco_total: preco,
                    data: data,
                    horario: horario,
                    status: 'ativo'
                }]);

                if (error) throw error;

                fecharModalAgendamentoManual();
                mostrarAlerta("Agendamento avulso efetuado com sucesso!", true);
                carregarAgendaSemanal();
            } catch (err) {
                mostrarAlerta("Erro ao efetuar agendamento manual: " + err.message, false);
            }
        }

        async function abrirGerenciadorAgendamento(id) {
            try {
                const { data } = await _supabase.from("agendamentos_barreto").select("*").eq("id", id).single();
                if (!data) return;

                const modal = document.getElementById("custom-action-modal");
                const detailsBox = document.getElementById("action-modal-details");
                const paymentBox = document.getElementById("payment-box");
                const buttonsBox = document.getElementById("action-modal-buttons");

                const preco = Number(data.preco_total || 35).toFixed(2).replace(".", ",");

                detailsBox.innerHTML = `
                    <strong>Cliente:</strong> ${data.cliente}<br>
                    <strong>Telefone:</strong> ${data.telefone || 'Não informado'}<br>
                    <strong>Serviço:</strong> ${data.servico}<br>
                    <strong>Valor:</strong> R$ ${preco}<br>
                    <strong>Horário:</strong> ${String(data.horario).substring(0,5)}
                `;

                paymentBox.style.display = "none";
                
                function renderizarBotoesPrincipais() {
                    buttonsBox.innerHTML = "";

                    if (data.status !== 'concluido') {
                        const btnAtendido = document.createElement("button");
                        btnAtendido.className = "custom-modal-btn btn-modal-atendido";
                        btnAtendido.textContent = "Concluir e Confirmar Pgto";
                        btnAtendido.onclick = () => {
                            paymentBox.style.display = "block";
                            buttonsBox.innerHTML = "";

                            const btnSalvarPg = document.createElement("button");
                            btnSalvarPg.className = "custom-modal-btn btn-modal-confirmar";
                            btnSalvarPg.textContent = "Salvar Pagamento";
                            btnSalvarPg.onclick = async () => {
                                try {
                                    btnSalvarPg.textContent = "Salvando...";
                                    btnSalvarPg.disabled = true;
                                    const forma = document.getElementById("select-forma-pagamento").value;
                                    const { error } = await _supabase.from("agendamentos_barreto").update({ status: 'concluido', pagamentos: forma }).eq("id", id);
                                    if (error) throw error;
                                    modal.classList.remove("active");
                                    carregarAgendaSemanal();
                                } catch (err) {
                                    mostrarAlerta("Erro ao concluir: " + err.message, false);
                                    btnSalvarPg.textContent = "Salvar Pagamento";
                                    btnSalvarPg.disabled = false;
                                }
                            };

                            const btnVoltar = document.createElement("button");
                            btnVoltar.className = "custom-modal-btn btn-modal-cancelar";
                            btnVoltar.textContent = "Voltar";
                            btnVoltar.onclick = () => {
                                paymentBox.style.display = "none";
                                renderizarBotoesPrincipais();
                            };

                            buttonsBox.appendChild(btnSalvarPg);
                            buttonsBox.appendChild(btnVoltar);
                        };

                        const btnCancelar = document.createElement("button");
                        btnCancelar.className = "custom-modal-btn btn-modal-excluir";
                        btnCancelar.textContent = "Cancelar Agendamento";
                        btnCancelar.onclick = () => {
                            buttonsBox.innerHTML = `
                                <p style="color: #e74c3c; font-weight: bold; margin-bottom: 12px; font-size: 0.9rem; text-align: center;">Tem a certeza que deseja cancelar esta reserva?</p>
                            `;
                            
                            const btnConfirmarCancelamento = document.createElement("button");
                            btnConfirmarCancelamento.className = "custom-modal-btn btn-modal-excluir";
                            btnConfirmarCancelamento.textContent = "Sim, Cancelar Reserva";
                            btnConfirmarCancelamento.onclick = async () => {
                                try {
                                    btnConfirmarCancelamento.textContent = "A cancelar...";
                                    btnConfirmarCancelamento.disabled = true;
                                    
                                    // Utiliza DELETE em vez de UPDATE para evitar o bloqueio de permissão na chave pública
                                    const { error } = await _supabase.from("agendamentos_barreto").delete().eq("id", id);
                                    if (error) throw error;
                                    
                                    modal.classList.remove("active");
                                    carregarAgendaSemanal();
                                } catch (err) {
                                    mostrarAlerta("Erro ao apagar agendamento: " + err.message, false);
                                    renderizarBotoesPrincipais();
                                }
                            };

                            const btnVoltarCancelamento = document.createElement("button");
                            btnVoltarCancelamento.className = "custom-modal-btn btn-modal-cancelar";
                            btnVoltarCancelamento.textContent = "Não, Voltar";
                            btnVoltarCancelamento.onclick = renderizarBotoesPrincipais;

                            buttonsBox.appendChild(btnConfirmarCancelamento);
                            buttonsBox.appendChild(btnVoltarCancelamento);
                        };

                        buttonsBox.appendChild(btnAtendido);
                        buttonsBox.appendChild(btnCancelar);
                    }

                    const btnFechar = document.createElement("button");
                    btnFechar.className = "custom-modal-btn btn-modal-cancelar";
                    btnFechar.textContent = "Fechar";
                    btnFechar.onclick = () => modal.classList.remove("active");
                    buttonsBox.appendChild(btnFechar);
                }

                renderizarBotoesPrincipais();
                modal.classList.add("active");
            } catch (err) {
                console.error(err);
            }
        }

        async function carregarResumoAdmin() {
            const dataFiltro = document.getElementById("filter-date-admin").value;
            const container = document.getElementById("agendamentos-list-admin");
            if (!dataFiltro) return;
            
            container.innerHTML = "<p style='color: #888; text-align: center;'>A carregar...</p>";

            try {
                const { data } = await _supabase.from("agendamentos_barreto").select("*").like("data", `${dataFiltro}%`).order("horario", { ascending: true });
                
                container.innerHTML = "";
                const filtrados = (data || []).filter(a => a.status !== 'cancelado');

                if (filtrados.length === 0) {
                    container.innerHTML = "<p style='color: #aaa; text-align: center; padding: 10px; background: #1A1A1A; border-radius: 6px;'>Sem agendamentos ativos.</p>";
                    return;
                }

                filtrados.forEach(item => {
                    const card = document.createElement("div");
                    const isConcluido = item.status === 'concluido';
                    card.style.cssText = "background: #1A1A1A; padding: 10px; border-radius: 6px; border: 1px solid #333; border-left: 4px solid " + (isConcluido ? '#25D366' : '#FF6600');
                    card.innerHTML = `
                        <strong style="font-size:0.85rem; color:#FFF;">${String(item.horario).substring(0,5)} - ${item.barbeiro}</strong><br>
                        <span style="font-size:0.8rem; color:#CCC;">Cliente: ${item.cliente} | ${item.servico} | R$ ${Number(item.preco_total || 35).toFixed(2).replace(".", ",")}</span>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = "<p style='color: #e74c3c; text-align: center;'>Erro ao carregar.</p>";
            }
        }
    </script>
