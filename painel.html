<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.jpg.jpg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { height: 100%; background: #121212; color: #FFF; }
        .barber-header { text-align: center; padding: 15px 10px; margin-bottom: 10px; border-bottom: 1px solid #333; }
        .brand-logo-container { width: 80px; height: 80px; margin: 0 auto 10px auto; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 10px rgba(255,102,0,0.2); border: 2px solid #FF6600; }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .barber-header h1 { font-size: 1.3rem; color: #FFF; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Modais */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: 0.2s; }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal { background: #1A1A1A; border: 1px solid #333; border-radius: 8px; padding: 25px; width: 90%; max-width: 420px; text-align: center; }
        .custom-modal input, .custom-modal select { width: 100%; padding: 12px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF; margin-bottom: 15px; outline: none; }
        .custom-modal-btn { width: 100%; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; border: none; margin-bottom: 10px; }

        /* GRADE HORIZONTAL SEMANAL */
        .week-horizontal-container {
            display: grid;
            grid-template-columns: repeat(6, 210px);
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 20px;
            width: 100%;
            scrollbar-width: thin;
            scrollbar-color: #FF6600 #1A1A1A;
        }
        .day-column {
            min-width: 210px; 
            max-width: 210px;
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .day-header { font-size: 0.85rem; color: #FFF; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Slots de Atendimento */
        .slot-item { background: #242424; padding: 8px; border-radius: 6px; font-size: 0.78rem; border: 1px solid #333; border-left: 4px solid #555; color: #FFF; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
        .slot-item.booked { border-left-color: #3498db; }
        .slot-item.booked-done { border-left-color: #25D366; background: #152219; }
        .slot-item.blocked { border-left-color: #e74c3c; background: #2C1A1A; }
        .slot-item.busy { border-left-color: #f39c12; background: #2a2215; opacity: 0.8; }
        .slot-item.available { border-left-color: #FF6600; }
        .action-btn { padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.7rem; border: none; white-space: nowrap; }
    </style>
</head>

                </div>
            </div>

            <div style="background: #1A1A1A; border: 1px solid #333; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 140px;">
                        <label style="font-size: 0.75rem; color: #888; display: block; margin-bottom: 3px;">Data:</label>
                        <input type="date" id="filter-date-admin" onchange="carregarResumoAdmin()" style="width: 100%; padding: 8px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF; outline: none; font-size: 0.85rem;">

                        </select>

                </div>
            </div>

            <div id="agendamentos-list-admin" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </section>
