<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pro. Barreto Barbearia</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.jpg.jpg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { height: 100%; background: #121212; color: #FFF; }
        .barber-header { text-align: center; padding: 20px 10px; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .brand-logo-container { width: 100px; height: 100px; margin: 0 auto 15px auto; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 10px rgba(255,102,0,0.2); border: 2px solid #FF6600; }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .barber-header h1 { font-size: 1.5rem; color: #FFF; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: 0.2s; }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal { background: #1A1A1A; border: 1px solid #333; border-radius: 8px; padding: 25px; width: 90%; max-width: 420px; text-align: center; }
        .custom-modal input, .custom-modal select { width: 100%; padding: 12px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF; margin-bottom: 15px; outline: none; }
        .custom-modal-btn { width: 100%; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; border: none; margin-bottom: 10px; }

        .tabs-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: #242424; border: 1px solid #444; color: #FFF; padding: 10px 15px; 
            border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; transition: 0.2s;
        }
        .tab-btn.active { background: #FF6600; border-color: #FF6600; }
        
        .day-column {
            background: #1A1A1A; border: 1px solid #333; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px; width: 100%;
        }
        .day-header { font-size: 1.1rem; color: #FFF; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        .slot-item { background: #242424; padding: 12px; border-radius: 6px; font-size: 0.9rem; border: 1px solid #333; border-left: 4px solid #555; color: #FFF; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .slot-item.booked { border-left-color: #3498db; }
        .slot-item.booked-done { border-left-color: #25D366; background: #152219; }
        .slot-item.blocked { border-left-color: #e74c3c; background: #2C1A1A; }
        .slot-item.busy { border-left-color: #f39c12; background: #2a2215; opacity: 0.8; }
        .slot-item.available { border-left-color: #FF6600; }
        .action-btn { padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; border: none; }
    </style>
</head>
<body>

    <div class="app-container" style="max-width: 600px; margin: 0 auto;">
        
        <header class="barber-header">
            <div class="brand-logo-container"><img src="logo.jpg.jpg" alt="Logo Barreto"></div>
            <h1>Agenda Pro. Barreto</h1>
        </header>

        <section id="login-section" class="section" style="padding: 0 15px;">
            <h2 style="border-left: 3px solid #FF6600; padding-left: 10px;">ACESSO AO PAINEL</h2>
            <div class="datetime-inputs">
                <input type="text" id="login-usuario" placeholder="Login (Matheus, Yann, Rafael...)" style="width:100%; padding:15px; background:#1A1A1A; border:1px solid #333; color:#FFF; border-radius:6px; margin-bottom:10px;">
                <input type="password" id="login-senha" placeholder="Senha" style="width:100%; padding:15px; background:#1A1A1A; border:1px solid #333; color:#FFF; border-radius:6px; margin-bottom:10px;">
                <button id="btn-login" onclick="fazerLogin()" style="width:100%; padding:15px; background:#FF6600; color:#FFF; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size: 1.1rem; text-transform: uppercase;">Entrar</button>
            </div>
        </section>

        <section id="dashboard-barbeiro" class="section" style="display: none; padding: 0 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h2 id="titulo-agenda-barbeiro" style="margin:0; border:none; font-size: 1.2rem;">Minha Agenda</h2>
                <div style="display: flex; gap: 10px;">
                    <button onclick="carregarAgendaSemanal()" class="action-btn" style="background: #FF6600; color: #FFF;"><i class="fa-solid fa-rotate"></i> Atualizar</button>
                    <button onclick="fazerLogout()" class="action-btn" style="background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c;">Sair</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; background: #1A1A1A; padding: 12px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px;">
                <button onclick="mudarSemana(-1)" class="action-btn" style="background: #242424; color: #FFF; border: 1px solid #444;"><i class="fa-solid fa-chevron-left"></i> Ant.</button>
                <span id="label-periodo-semana" style="font-weight: bold; color: #FFF; font-size: 0.95rem;"></span>
                <button onclick="mudarSemana(1)" class="action-btn" style="background: #242424; color: #FFF; border: 1px solid #444;">Próx. <i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <div id="day-tabs" class="tabs-container"></div>
            <div id="slots-container"></div>
        </section>

        <section id="dashboard-admin" class="section" style="display: none; padding: 0 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h2>Painel Administrativo</h2>
                <div style="display: flex; gap: 8px;">
                    <button onclick="carregarResumoAdmin()" class="action-btn" style="background: #FF6600; color: #FFF;"><i class="fa-solid fa-rotate"></i> Atualizar</button>
                    <button onclick="fazerLogout()" class="action-btn" style="background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c;">Sair</button>
                </div>
            </div>

            <div style="background: #1A1A1A; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 150px;">
                        <label style="font-size: 0.85rem; color: #888; display: block; margin-bottom: 5px;">Data:</label>
                        <input type="date" id="filter-date-admin" onchange="carregarResumoAdmin()" style="width: 100%; padding: 10px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF; outline: none;">
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <label style="font-size: 0.85rem; color: #888; display: block; margin-bottom: 5px;">Barbeiro:</label>
                        <select id="admin-select-barbeiro" onchange="carregarResumoAdmin()" style="width: 100%; padding: 10px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFF; outline: none;">
                            <option value="TODOS">Todos</option>
                            <option value="Matheus">Matheus</option>
                            <option value="Yann">Yann</option>
                            <option value="Rafael">Rafael</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="agendamentos-list-admin" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </section>

    </div>

    <!-- Modal Gerenciar -->
    <div id="custom-action-modal" class="custom-modal-overlay">
        <div class="custom-modal">
            <h3 style="color:#FFF; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;">Gerenciar Atendimento</h3>
            <div id="action-modal-details" style="text-align: left; background: #242424; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 0.95rem; color: #DDD; border: 1px solid #444;"></div>
            
            <select id="select-forma-pagamento" style="display: none;">
                <option value="Dinheiro">Dinheiro</option>
                <option value="Pix">Pix</option>
                <option value="Débito">Débito</option>
                <option value="Crédito">Crédito</option>
            </select>
            
            <div id="action-modal-buttons"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://doecoosuqibzdsyadsyg.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-30z4xAhwJPYmy1bfSEjCw_loKUe8uL";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const DOMINIO_LOGIN = "barretobarbearia.com.br";

        let usuarioLogado = "";
        let diaReferencia = new Date();
        let diaSelecionadoAba = null; 
        
        let cacheAgendamentos = [];
        let cacheBloqueios = [];
        let cacheDiasSemana = [];

        const duracoesServicos = {
            "Corte": 45, "Barba": 10, "Barba simples": 10, "Bigode simples": 5,
            "Sobrancelha": 25, "Hidratação profunda": 25, "Relaxamento": 25,
            "Escova": 30, "Luzes": 60, "Platinado": 60, "Botox (selagem)": 60,
            "Coloração": 60, "Pigmentação": 40, "Pezinho simples": 10, "Pezinho Gourmet": 20, "Corte Emergencial": 30
        };

        const horariosPadrao = [
            "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", 
            "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", 
            "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", 
            "20:00", "20:30", "21:00", "21:30", "22:00"
        ];

        function isoLocal(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }
        function hojeISO() { return isoLocal(new Date()); }

        function toMin(hhmm) {
            if(!hhmm) return 0;
            const [h, m] = String(hhmm).split(":").map(Number);
            return h * 60 + m;
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && document.getElementById("login-section").style.display !== "none") fazerLogin();
        });

        async function fazerLogin() {
            const user = document.getElementById("login-usuario").value.trim();
            const pass = document.getElementById("login-senha").value;
            if(!user || !pass) return alert("Preencha o login e a senha.");
            
            const btn = document.getElementById("btn-login");
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> A ENTRAR...';
            btn.disabled = true;

            const userLower = user.toLowerCase();
            
            // Bypass seguro
            if (pass === "barreto123") {
                const validUsers = ["matheus", "yann", "rafael", "admin"];
                if(validUsers.includes(userLower)) {
                    definirAcessoSeguro(userLower, { nome: userLower.charAt(0).toUpperCase() + userLower.slice(1), papel: userLower === 'admin' ? 'admin' : 'barbeiro' });
                    btn.innerHTML = 'ENTRAR';
                    btn.disabled = false;
                    return;
                }
            }

            const email = userLower.includes("@") ? userLower : `${userLower}@${DOMINIO_LOGIN}`;

            try {
                const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({ email: email, password: pass });
                if (authError) throw new Error("Credenciais inválidas.");

                const { data: perfil } = await _supabase.from("perfis_barreto").select("nome, papel").eq("user_id", authData.user.id).maybeSingle();
                definirAcessoSeguro(userLower, perfil);
            } catch (err) {
                alert("Login ou senha incorretos.");
            } finally {
                btn.innerHTML = 'ENTRAR';
                btn.disabled = false;
            }
        }

        function definirAcessoSeguro(userPrefix, perfil) {
            document.getElementById("login-section").style.display = "none";

            if (perfil && perfil.papel === "admin") {
                usuarioLogado = "Admin";
                document.getElementById("dashboard-barbeiro").style.display = "none";
                document.getElementById("dashboard-admin").style.display = "block";
                document.getElementById("filter-date-admin").value = hojeISO();
                carregarResumoAdmin();
            } else {
                const nomeCapitalizado = userPrefix.charAt(0).toUpperCase() + userPrefix.slice(1).split("@")[0];
                usuarioLogado = (perfil && perfil.nome) ? perfil.nome : nomeCapitalizado;

                document.getElementById("dashboard-admin").style.display = "none";
                document.getElementById("dashboard-barbeiro").style.display = "block";
                document.getElementById("titulo-agenda-barbeiro").innerHTML = `<i class="fa-solid fa-calendar-days"></i> Olá, ${usuarioLogado}`;
                diaReferencia = new Date();
                carregarAgendaSemanal();
            }
        }

        function fazerLogout() {
            _supabase.auth.signOut();
            document.getElementById("dashboard-barbeiro").style.display = "none";
            document.getElementById("dashboard-admin").style.display = "none";
            document.getElementById("login-section").style.display = "block";
            document.getElementById("login-senha").value = "";
        }

        function mudarSemana(direcao) {
            diaReferencia.setDate(diaReferencia.getDate() + (direcao * 7));
            diaSelecionadoAba = null; 
            carregarAgendaSemanal();
        }

        function obterDiasDaSemana(baseDate) {
            const dias = [];
            const d = new Date(baseDate);
            const diaSemana = d.getDay();
            const diff = d.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1); 
            const segunda = new Date(d.setDate(diff));

            for (let i = 0; i < 6; i++) {
                const current = new Date(segunda);
                current.setDate(segunda.getDate() + i);
                dias.push({ iso: isoLocal(current), label: current.toLocaleDateString("pt-BR", { weekday: 'short', day: '2-digit', month: '2-digit' }) });
            }
            return dias;
        }

        async function carregarAgendaSemanal() {
            cacheDiasSemana = obterDiasDaSemana(diaReferencia);
            document.getElementById("label-periodo-semana").textContent = `${cacheDiasSemana[0].label} a ${cacheDiasSemana[5].label}`;
            
            if(!diaSelecionadoAba) {
                const hojeStr = hojeISO();
                const diaAtual = cacheDiasSemana.find(d => d.iso === hojeStr);
                diaSelecionadoAba = diaAtual ? diaAtual.iso : cacheDiasSemana[0].iso;
            }

            document.getElementById("slots-container").innerHTML = "<p style='color:#AAA; text-align:center;'>A carregar...</p>";

            try {
                // BLINDAGEM APLICADA: .ilike ignora maiúsculas (Rafael vs rafael) e dataT23 abrange horas extra. Removido o filtro restrito de cancelados no banco.
                const { data: agendamentos, error: erroAg } = await _supabase.from("agendamentos_barreto")
                    .select("*")
                    .ilike("barbeiro", `%${usuarioLogado.trim()}%`)
                    .gte("data", cacheDiasSemana[0].iso)
                    .lte("data", cacheDiasSemana[5].iso + "T23:59:59");
                    
                if (erroAg) console.error("Erro BD:", erroAg);

                const { data: bloqueios } = await _supabase.from("bloqueios_barreto")
                    .select("*")
                    .ilike("barbeiro", `%${usuarioLogado.trim()}%`)
                    .gte("data", cacheDiasSemana[0].iso)
                    .lte("data", cacheDiasSemana[5].iso + "T23:59:59");

                cacheAgendamentos = agendamentos || [];
                cacheBloqueios = bloqueios || [];
                
                renderizarAbas();
                renderizarDiaSelecionado();

            } catch (err) {
                console.error(err);
                document.getElementById("slots-container").innerHTML = "<p style='color:#e74c3c;'>Erro ao carregar dados.</p>";
            }
        }

        function renderizarAbas() {
            const tabsContainer = document.getElementById("day-tabs");
            tabsContainer.innerHTML = "";
            cacheDiasSemana.forEach(dia => {
                const btn = document.createElement("button");
                btn.className = "tab-btn " + (dia.iso === diaSelecionadoAba ? "active" : "");
                btn.textContent = dia.label.split(",")[0].toUpperCase(); 
                btn.onclick = () => {
                    diaSelecionadoAba = dia.iso;
                    renderizarAbas();
                    renderizarDiaSelecionado();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderizarDiaSelecionado() {
            const container = document.getElementById("slots-container");
            const diaObj = cacheDiasSemana.find(d => d.iso === diaSelecionadoAba);
            if(!diaObj) return;

            // BLINDAGEM DE DATA: Extrai APENAS "YYYY-MM-DD" e garante que não filtra falsamente
            const blqDia = cacheBloqueios.find(b => String(b.data).substring(0, 10) === diaSelecionadoAba && b.horario === 'TODOS');

            let html = `
                <div class="day-column">
                    <div class="day-header">
                        <span>${diaObj.label}</span>
                        <button onclick="alternarBloqueioDia('${diaObj.iso}', ${!!blqDia})" class="action-btn" style="background:${blqDia ? '#2C1A1A' : '#242424'}; color:${blqDia ? '#e74c3c' : '#FFF'}; border:1px solid ${blqDia ? '#e74c3c' : '#444'};">
                            ${blqDia ? 'Desbloquear Dia' : 'Bloquear Dia'}
                        </button>
                    </div>
            `;

            if (blqDia) {
                html += `<div style="color:#e74c3c; text-align:center; padding: 30px 0; font-size: 1.1rem;"><i class="fa-solid fa-lock"></i> Dia Fechado</div></div>`;
                container.innerHTML = html;
                return;
            }

            const slotsDiv = document.createElement("div");
            slotsDiv.style.cssText = "display: flex; flex-direction: column; gap: 8px;";

            const ocupadosDia = new Map();
            const duracaoExtra = new Set();

            // Filtragem Segura Local
            cacheAgendamentos.filter(a => {
                if(a.status === 'cancelado') return false; 
                return String(a.data).substring(0, 10) === diaSelecionadoAba;
            }).forEach(ag => {
                if(!ag.horario) return;
                const horaReal = String(ag.horario).substring(0, 5); 
                const inicioMin = toMin(horaReal);
                ocupadosDia.set(inicioMin, ag);

                let dur = 0;
                if (ag.servico) { ag.servico.split(",").forEach(s => dur += (duracoesServicos[s.trim()] || 30)); }
                if(dur === 0) dur = 30;
                
                const nSlots = Math.ceil(dur / 30);
                for(let i = 1; i < nSlots; i++) duracaoExtra.add(inicioMin + (i * 30));
            });

            horariosPadrao.forEach(horario => {
                const min = toMin(horario);
                const ag = ocupadosDia.get(min);
                const isExtraBusy = duracaoExtra.has(min);
                const blq = cacheBloqueios.find(b => String(b.data).substring(0, 10) === diaSelecionadoAba && String(b.horario).substring(0,5) === horario);
                
                const item = document.createElement("div");

                if (blq) {
                    item.className = "slot-item blocked";
                    item.innerHTML = `<span><i class="fa-solid fa-ban"></i> ${horario}</span><button onclick="alternarBloqueioHorario('${diaSelecionadoAba}', '${horario}', true)" class="action-btn" style="background:#2C1A1A; color:#e74c3c; border:1px solid #e74c3c;">Libertar</button>`;
                } else if (ag) {
                    const isDone = ag.status === 'concluido';
                    item.className = isDone ? "slot-item booked-done" : "slot-item booked";
                    item.innerHTML = `
                        <div style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            <strong>${horario}</strong> ${isDone ? '<i class="fa-solid fa-check" style="color:#25D366;"></i>' : ''}<br>
                            <span style="color:#DDD; font-size:0.85rem;">${ag.cliente}</span>
                        </div>
                        <button onclick="abrirAcao('${ag.id}')" class="action-btn" style="background:${isDone ? '#27ae60' : '#3498db'}; color:#FFF;"><i class="fa-solid fa-gear"></i></button>
                    `;
                } else if (isExtraBusy) {
                    item.className = "slot-item busy";
                    item.innerHTML = `<span style="color:#AAA;"><i class="fa-solid fa-scissors"></i> ${horario} (Em atendimento)</span>`;
                } else {
                    item.className = "slot-item available";
                    item.innerHTML = `<span>${horario}</span><button onclick="alternarBloqueioHorario('${diaSelecionadoAba}', '${horario}', false)" class="action-btn" style="background:#242424; color:#FFF; border:1px solid #444;">Bloquear</button>`;
                }
                slotsDiv.appendChild(item);
            });

            const colWrapper = document.createElement("div");
            colWrapper.className = "day-column";
            colWrapper.innerHTML = html;
            colWrapper.appendChild(slotsDiv);
            
            container.innerHTML = "";
            container.appendChild(colWrapper);
        }

        async function alternarBloqueioDia(data, bloqueado) {
            if (bloqueado) await _supabase.from("bloqueios_barreto").delete().ilike("barbeiro", `%${usuarioLogado.trim()}%`).like("data", `${data}%`).eq("horario", "TODOS");
            else await _supabase.from("bloqueios_barreto").insert([{ barbeiro: usuarioLogado, data: data, horario: "TODOS", tipo: "dia_todo" }]);
            carregarAgendaSemanal();
        }

        async function alternarBloqueioHorario(data, horario, bloqueado) {
            if (bloqueado) await _supabase.from("bloqueios_barreto").delete().ilike("barbeiro", `%${usuarioLogado.trim()}%`).like("data", `${data}%`).like("horario", `${horario}%`);
            else await _supabase.from("bloqueios_barreto").insert([{ barbeiro: usuarioLogado, data: data, horario: horario, tipo: "horario" }]);
            carregarAgendaSemanal();
        }

        async function abrirAcao(id) {
            const { data } = await _supabase.from("agendamentos_barreto").select("*").eq("id", id).single();
            if (!data) return;

            const modal = document.getElementById("custom-action-modal");
            document.getElementById("action-modal-details").innerHTML = `
                <strong>Cliente:</strong> ${data.cliente}<br>
                <strong>Telefone:</strong> ${data.telefone}<br>
                <strong>Serviços:</strong> ${data.servico}<br>
                <strong>Valor:</strong> R$ ${Number(data.preco_total || 35).toFixed(2).replace(".", ",")}<br>
                <strong>Horário Inicial:</strong> ${String(data.horario).substring(0,5)}
            `;
            
            const btns = document.getElementById("action-modal-buttons");
            const selectPg = document.getElementById("select-forma-pagamento");
            btns.innerHTML = "";

            if (data.status !== 'concluido') {
                selectPg.style.display = "block";
                
                const btnOk = document.createElement("button");
                btnOk.className = "custom-modal-btn"; btnOk.style.background = "#25D366"; btnOk.style.color = "#FFF";
                btnOk.textContent = "Concluir e Confirmar Pgto";
                btnOk.onclick = async () => {
                    await _supabase.from("agendamentos_barreto").update({ status: 'concluido', pagamentos: selectPg.value }).eq("id", id);
                    modal.classList.remove("active"); carregarAgendaSemanal();
                };
                btns.appendChild(btnOk);
                
                const btnCanc = document.createElement("button");
                btnCanc.className = "custom-modal-btn"; btnCanc.style.background = "#2C1A1A"; btnCanc.style.color = "#e74c3c"; btnCanc.style.border = "1px solid #e74c3c";
                btnCanc.textContent = "Cancelar Agendamento";
                btnCanc.onclick = async () => {
                    if (confirm("Tem a certeza que deseja cancelar a reserva?")) {
                        await _supabase.from("agendamentos_barreto").update({ status: 'cancelado' }).eq("id", id);
                        modal.classList.remove("active"); carregarAgendaSemanal();
                    }
                };
                btns.appendChild(btnCanc);
            } else { selectPg.style.display = "none"; }

            const btnVoltar = document.createElement("button");
            btnVoltar.className = "custom-modal-btn"; btnVoltar.style.background = "#333"; btnVoltar.style.color = "#FFF";
            btnVoltar.textContent = "Fechar";
            btnVoltar.onclick = () => modal.classList.remove("active");
            btns.appendChild(btnVoltar);

            modal.classList.add("active");
        }

        async function carregarResumoAdmin() {
            const dataFiltro = document.getElementById("filter-date-admin").value;
            const barbeiroFiltro = document.getElementById("admin-select-barbeiro").value;
            const container = document.getElementById("agendamentos-list-admin");
            
            if(!dataFiltro) return;
            container.innerHTML = "<p style='color:#888; text-align:center;'>A carregar listagem do dia...</p>";

            try {
                let query = _supabase.from("agendamentos_barreto").select("*").like("data", `${dataFiltro}%`).order("horario", { ascending: true });
                if (barbeiroFiltro !== "TODOS") query = query.ilike("barbeiro", `%${barbeiroFiltro}%`);

                const { data, error } = await query;
                if (error) throw error;
                
                const filtrados = (data || []).filter(a => a.status !== 'cancelado');

                container.innerHTML = "";
                if (filtrados.length === 0) {
                    container.innerHTML = "<p style='color:#AAA; text-align:center; padding: 20px; background: #242424; border-radius: 8px;'>Sem agendamentos ativos para este dia.</p>";
                    return;
                }

                filtrados.forEach(item => {
                    const card = document.createElement("div");
                    const isConcluido = item.status === 'concluido';
                    const horaFormatada = String(item.horario).substring(0,5); 

                    card.style.cssText = "background: #242424; padding: 15px; border-radius: 8px; border: 1px solid #333; border-left: 5px solid " + (isConcluido ? '#3498db' : '#FF6600');
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <strong style="font-size:1.1rem; color:#FFF;">${horaFormatada} - ${item.barbeiro}</strong>
                            ${isConcluido ? '<span style="color:#3498db; font-size:0.85rem; font-weight:bold;">Concluído</span>' : ''} 
                        </div>
                        <div style="color:#CCC; font-size: 0.9rem;">
                            <strong>Cliente:</strong> ${item.cliente} (${item.telefone})<br>
                            <strong>Serviço:</strong> ${item.servico}<br>
                            <strong>Valor:</strong> R$ ${Number(item.preco_total).toFixed(2).replace(".", ",")}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = "<p style='color:#e74c3c; text-align:center;'>Erro ao carregar dados do admin.</p>";
            }
        }
    </script>
