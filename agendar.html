<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barreto Barbearia | Agendamento</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barreto">
    <link rel="apple-touch-icon" href="logo.jpg.jpg">
    <link rel="icon" href="logo.jpg.jpg" type="image/jpeg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Força o calendário do navegador a assumir o modo escuro (Dark Mode) */
        input[type="date"] {
            color-scheme: dark;
            background: #1A1A1A;
            border: 1px solid #333333;
            color: #FFF;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        /* Estilos modernos para o Grid de Horários em Botões */
        .times-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }
        .time-card {
            background: #1A1A1A;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            color: #FFF;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .time-card:hover {
            border-color: #FF6600;
            background: rgba(255, 102, 0, 0.05);
        }
        .time-card.active {
            background: rgba(255, 102, 0, 0.15);
            border-color: #FF6600;
            color: #FF6600;
            box-shadow: 0 0 8px rgba(255, 102, 0, 0.3);
        }
        .time-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #111;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="barber-header">
            <div class="brand-info">
                <div class="brand-logo-container" style="width: 60px; height: 60px; margin-bottom: 0;">
                    <img src="logo.jpg.jpg" alt="Barreto Barbearia Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                </div>
                <div>
                    <h1>Barreto Barbearia</h1>
                    <p>Estilo e Tradição</p>
                </div>
            </div>
        </header>

        <!-- Seleção de Barbeiros -->
        <section class="section">
            <h2>1. Escolha o Profissional</h2>
            <div class="barbers-grid">
                <div class="barber-card active" onclick="selectBarber(this, 'Matheus')">
                    <i class="fa-solid fa-user-tie" style="font-size: 1.2rem; color: #FF6600; margin-bottom: 4px;"></i>
                    <h3>Matheus</h3>
                </div>
                <div class="barber-card" onclick="selectBarber(this, 'Yann')">
                    <i class="fa-solid fa-user-tie" style="font-size: 1.2rem; color: #FF6600; margin-bottom: 4px;"></i>
                    <h3>Yann</h3>
                </div>
                <div class="barber-card" onclick="selectBarber(this, 'Rafael')">
                    <i class="fa-solid fa-user-tie" style="font-size: 1.2rem; color: #FF6600; margin-bottom: 4px;"></i>
                    <h3>Rafael</h3>
                </div>
            </div>
        </section>

        <!-- Seleção de Serviços -->
        <section class="section">
            <h2>2. Escolha os Serviços</h2>
            <div class="services-grid" id="dynamic-services-grid">
                <p style="color: #888; font-size: 0.85rem; grid-column: span 2; text-align: center; padding: 20px;">A carregar serviços...</p>
            </div>
        </section>

        <!-- Seleção de Data e Horário em Cards -->
        <section class="section">
            <h2>3. Data e Horário</h2>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div class="input-group" style="width: 100%;">
                    <label for="date">Data:</label>
                    <input type="date" id="date" onchange="checkAvailableTimes()">
                </div>
                <div class="input-group" style="width: 100%;">
                    <label>Selecione o Horário:</label>
                    <div id="times-grid" class="times-grid">
                        <span style="color: #888; font-size: 0.85rem;">Selecione uma data acima primeiro</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Identificação do Cliente -->
        <section class="section">
            <h2>4. Seus Dados</h2>
            <div class="client-inputs">
                <div class="input-group">
                    <label for="client-phone">WhatsApp / Telefone:</label>
                    <input type="tel" id="client-phone" placeholder="Seu WhatsApp (com DDD)" required onblur="buscarClientePorTelefone()">
                </div>
                <div class="input-group">
                    <label for="client-name">Nome Completo:</label>
                    <input type="text" id="client-name" placeholder="Seu Nome Completo" required>
                </div>
            </div>
        </section>

        <div style="height: 100px; width: 100%;"></div>

        <footer class="footer-action">
            <button class="btn-whatsapp" id="btn-continuar" onclick="abrirModalConfirmacao()">
                Continuar Agendamento <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
            </button>
        </footer>

    </div>

    <div id="modal-confirmacao" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 9999;">
        <div style="background: #1A1A1A; border: 1px solid #333333; border-radius: 12px; padding: 25px; width: 90%; max-width: 400px; text-align: center; color: #FFF;">
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.3rem; color: #FFF;">Confirmar Agendamento</h3>
            <div id="resumo-agendamento" style="text-align: left; background: #242424; padding: 15px; border-radius: 8px; border: 1px solid #333333; margin-bottom: 20px; font-size: 0.95rem; color: #DDD; line-height: 1.6;"></div>
            <div style="display: flex; gap: 10px; flex-direction: column;">
                <button onclick="confirmarEEnviar()" style="padding: 14px; border-radius: 8px; font-weight: bold; border: none; background: #25D366; color: #FFF; cursor: pointer; font-size: 1rem;">
                    <i class="fa-brands fa-whatsapp"></i> Confirmar e Enviar
                </button>
                <button onclick="fecharModalConfirmacao()" style="padding: 14px; border-radius: 8px; font-weight: bold; border: 1px solid #444; background: #242424; color: #FFF; cursor: pointer; font-size: 1rem;">
                    Voltar e Editar
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
