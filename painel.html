    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #FFFFFF; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 100%; background-color: #121212; padding: 8px; padding-bottom: 90px; }
        
        .barber-header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; text-align: center; background: #181818; border-radius: 6px; padding-top: 8px; }
        .brand-logo-container { width: 65px; height: 65px; background: #1A1A1A; border: 2px solid #FF6600; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px auto; overflow: hidden; box-shadow: 0 0 12px rgba(255, 102, 0, 0.5); }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .barber-header h1 { font-size: 1.05rem; color: #FFFFFF; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .barber-header p { font-size: 0.7rem; color: #AAAAAA; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }

        #login-section { min-height: 50vh; display: flex; flex-direction: column; justify-content: center; padding: 0 15px; max-width: 380px; margin: auto; }
        
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: 0.2s ease-in-out; }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal { background: #1A1A1A; border: 1px solid #333; border-radius: 8px; padding: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .custom-modal h3 { color: #FFFFFF; font-size: 1rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .custom-modal p { color: #CCCCCC; font-size: 0.85rem; margin-bottom: 15px; line-height: 1.4; text-align: left; }
        .custom-modal input, .custom-modal select { width: 100%; padding: 10px; background: #242424; border: 1px solid #444; border-radius: 6px; color: #FFFFFF; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
        .custom-modal-buttons { display: flex; gap: 8px; flex-direction: column; }
        .custom-modal-btn { width: 100%; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; }
        .btn-modal-cancelar { background: #2A2A2A; color: #FFFFFF; border: 1px solid #444; }
        .btn-modal-confirmar { background: #FF6600; color: #FFFFFF; }
        .btn-modal-atendido { background: #25D366; color: #FFFFFF; }
        .btn-modal-excluir { background: #2C1A1A; color: #e74c3c; border: 1px solid #e74c3c; }

        .week-horizontal-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 6px; width: 100%; overflow-x: hidden; }
        .day-column { background: #1A1A1A; border: 1px solid #333; border-radius: 4px; padding: 2px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .day-header { font-size: 0.58rem; color: #FFFFFF; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 3px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
        
        .slot-item { background: #222222; padding: 3px 2px; border-radius: 3px; font-size: 0.55rem; display: flex; flex-direction: column; gap: 1px; border: 1px solid #333; border-left: 3px solid #555; color: #FFFFFF; cursor: pointer; transition: 0.15s; overflow: hidden; }
        .slot-item:hover { opacity: 0.85; }
        .slot-item.booked { border-left-color: #3498db; background: #192530; }
        .slot-item.concluded { border-left-color: #25D366; background: #13271C; }
        .slot-item.blocked { border-left-color: #e74c3c; background: #2C1A1A; }
        .slot-item.available { border-left-color: #FF6600; background: #1A1A1A; }
        .slot-item.retroactive { border-left-color: #333; background: #161616; opacity: 0.4; cursor: not-allowed; }

        .datetime-inputs { display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 0.8rem; color: #AAAAAA; }
        input, select { width: 100%; padding: 10px; background: #1A1A1A; border: 1px solid #333; border-radius: 6px; color: #FFFFFF; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #FF6600; background: #242424; }
        
        .btn-acao { width: 100%; padding: 10px; background-color: #FF6600; color: #FFFFFF; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; transition: 0.2s; text-transform: uppercase; }
        .btn-acao:hover { background-color: #e05b00; }
    </style>

    <script>
        const SUPABASE_URL = "https://doecoosuqibzdsyadsyg.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-30z4xAhwJPYmy1bfSEjCw_loKUe8uL";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioLogado = "";
        let offsetSemana = 0; 

        function obterHorariosParaData(dataString) {
            if (!dataString) return [];
            let horarios = [];
            let horaInicio = 8;
            let horaFim = 22;
            let currentMin = horaInicio * 60;
            let endMin = horaFim * 60;
            
            while (currentMin <= endMin) {
                let h = Math.floor(currentMin / 60);
                let m = currentMin % 60;
                horarios.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
                currentMin += 30; 
            }
            return horarios;
        }

        function fazerLogin() {
            // CORREÇÃO: Forçar minúsculas e limpar espaços nulos em ambos os campos para evitar erros de teclado
            const usuarioInput = document.getElementById("login-usuario").value.trim().toLowerCase();
            const senhaInput = document.getElementById("login-senha").value.trim().toLowerCase();

            if (!usuarioInput || !senhaInput) {
                alert("Preencha o utilizador e a senha.");
                return;
            }

            const senhasPermitidas = {
                "rafael": "rafael123",
                "matheus": "matheus123",
                "yann": "yann123",
                "admin": "admin123"
            };

            if (senhasPermitidas[usuarioInput] && senhaInput === senhasPermitidas[usuarioInput]) {
                document.getElementById("login-usuario").value = "";
                document.getElementById("login-senha").value = "";

                if (usuarioInput === 'admin') {
                    usuarioLogado = "Admin";
                    document.getElementById("login-section").style.display = "none";
                    document.getElementById("dashboard-barbeiro").style.display = "none";
                    document.getElementById("dashboard-admin").style.display = "block";
                    
                    const hoje = new Date();
                    document.getElementById("filter-date-admin").value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
                    carregarResumoAdmin();
                } else {
                    usuarioLogado = usuarioInput.charAt(0).toUpperCase() + usuarioInput.slice(1);
                    document.getElementById("login-section").style.display = "none";
                    document.getElementById("dashboard-admin").style.display = "none";
                    document.getElementById("dashboard-barbeiro").style.display = "block";
                    document.getElementById("titulo-agenda-barbeiro").textContent = `Agenda: ${usuarioLogado}`;
                    offsetSemana = 0;
                    carregarAgendaSemanal();
                }
            } else {
                alert("Utilizador ou senha incorretos! Verifique se o teclado não inseriu espaços vazios.");
            }
        }

        function fazerLogout() {
            usuarioLogado = "";
            document.getElementById("dashboard-barbeiro").style.display = "none";
            document.getElementById("dashboard-admin").style.display = "none";
            document.getElementById("login-section").style.display = "block";
        }

        function mudarSemana(direcao) {
            offsetSemana += direcao;
            carregarAgendaSemanal();
        }

        function obterDiasDaSemana(offset) {
            const dias = [];
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0); 
            
            const diaSemana = hoje.getDay();
            const diffParaSegunda = (diaSemana === 0 ? -6 : 1) - diaSemana + (offset * 7);
            const segunda = new Date(hoje);
            segunda.setDate(hoje.getDate() + diffParaSegunda);

            for (let i = 0; i < 6; i++) { 
                const d = new Date(segunda);
                d.setDate(segunda.getDate() + i);
                
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const isoString = `${yyyy}-${mm}-${dd}`;
                
                const formatada = d.toLocaleDateString("pt-BR", { weekday: 'short', day: '2-digit', month: '2-digit' });
                dias.push({ iso: isoString, label: formatada });
            }
            return dias;
        }

        async function carregarAgendaSemanal() {
            const container = document.getElementById("grade-semanal-container");
            const lblPeriodo = document.getElementById("label-periodo-semana");
            
            container.innerHTML = "<p style='color: #888; text-align: center; width: 100%; font-size: 0.65rem;'>A carregar...</p>";

            const diasSemana = obterDiasDaSemana(offsetSemana);
            lblPeriodo.textContent = `${diasSemana[0].label} até ${diasSemana[5].label}`;

            const agora = new Date();
            const dataHojeIso = `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}-${String(agora.getDate()).padStart(2, '0')}`;
            const horaAtualMinutos = agora.getHours() * 60 + agora.getMinutes();

            try {
                const primeiraData = diasSemana[0].iso;
                const ultimaData = diasSemana[5].iso;

                const { data: agendamentos } = await _supabase.from("agendamentos_barreto").select("*").ilike("barbeiro", `%${usuarioLogado}%`).gte("data", primeiraData).lte("data", ultimaData);
                const { data: bloqueios } = await _supabase.from("bloqueios_barreto").select("*").ilike("barbeiro", `%${usuarioLogado}%`).gte("data", primeiraData).lte("data", ultimaData);

                container.innerHTML = "";

                const bloqueiosAlmocoAutomaticos = {
                    "Rafael": ["13:00", "13:30"],
                    "Yann": ["12:00", "12:30", "13:00"],
                    "Matheus": ["13:30", "14:00", "14:30"]
                };
                const almocoPadrao = bloqueiosAlmocoAutomaticos[usuarioLogado] || [];

                diasSemana.forEach(dia => {
                    const coluna = document.createElement("div");
                    coluna.className = "day-column";

                    const blqDia = (bloqueios || []).find(b => String(b.data).substring(0, 10) === dia.iso && b.horario === 'TODOS');
                    
                    coluna.innerHTML = `
                        <div class="day-header">
                            <span>${dia.label}</span>
                            <button onclick="alternarBloqueioDia('${dia.iso}', ${!!blqDia})" style="background: ${blqDia ? '#2C1A1A' : '#242424'}; color: ${blqDia ? '#e74c3c' : '#FFF'}; border: 1px solid ${blqDia ? '#e74c3c' : '#444'}; padding: 1px 2px; border-radius: 2px; font-size: 0.5rem; cursor: pointer;">
                                ${blqDia ? 'Desbl' : 'Bloq'}
                            </button>
                        </div>
                    `;

                    const slotsDiv = document.createElement("div");
                    slotsDiv.style.cssText = "display: flex; flex-direction: column; gap: 2px;";

                    if (blqDia) {
                        slotsDiv.innerHTML = `<div style="color: #e74c3c; text-align: center; font-size: 0.55rem; padding: 10px 0; font-weight: bold;"><i class="fa-solid fa-lock"></i></div>`;
                    } else {
                        const horariosDia = obterHorariosParaData(dia.iso);
                        const agendamentosDia = (agendamentos || []).filter(a => String(a.data).substring(0, 10) === dia.iso && a.status !== 'cancelado');
                        const bloqueiosDia = (bloqueios || []).filter(b => String(b.data).substring(0, 10) === dia.iso && b.horario !== 'TODOS');
                        
                        let itensRenderizacao = [];

                        horariosDia.forEach(h => {
                            let ag = agendamentosDia.find(a => String(a.horario).substring(0, 5) === h);
                            let blq = bloqueiosDia.find(b => String(b.horario).substring(0, 5) === h);
                            let ehAlmocoAutomatico = almocoPadrao.includes(h) && !blq;

                            if (ag) {
                                itensRenderizacao.push({ tipo: 'agendamento', horario: h, dado: ag });
                            } else if (blq || ehAlmocoAutomatico) {
                                itensRenderizacao.push({ tipo: 'bloqueio', horario: h, dado: blq, automatico: ehAlmocoAutomatico });
                            } else {
                                itensRenderizacao.push({ tipo: 'vazio', horario: h });
                            }
                        });

                        itensRenderizacao.forEach(item => {
                            const itemSlot = document.createElement("div");

                            let isRetroativo = false;
                            if (dia.iso < dataHojeIso) {
                                isRetroativo = true;
                            } else if (dia.iso === dataHojeIso) {
                                const
